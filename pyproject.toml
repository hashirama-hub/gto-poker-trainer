[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gto-trainer"
version = "0.2.0"
description = "GTO Poker Trainer for MTT (8-max) - GTO Wizard mini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "python-jose>=3.3",
    "passlib>=1.7",
    "python-multipart>=0.0.6",
    "redis>=5.0",
    "httpx>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1.0",
    "mypy>=1.8",
]

[project.scripts]
gto-trainer = "gto.cli:main"
gto-api = "gto.api.main:run"
gto-worker = "gto.worker.main:run"

[tool.setuptools.packages.find]
include = ["gto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true